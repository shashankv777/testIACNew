apiVersion: v1
kind: Namespace
metadata:
  name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # MISCONFIGURATION: Running as root
      securityContext:
        runAsUser: 0
      containers:
      - name: mysql
        image: mysql:8.0
        # MISCONFIGURATION: Privileged container
        securityContext:
          privileged: true
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-password
        - name: MYSQL_DATABASE
          value: calendar_sync
        ports:
        - containerPort: 3306
        volumeMounts:
        # MISCONFIGURATION: Volume mount with OS directory write permissions
        - name: mysql-storage
          mountPath: /var/lib/mysql
        # MISCONFIGURATION: Mounting sensitive host directory
        - name: host-root
          mountPath: /host
        # MISCONFIGURATION: Mounting /etc directory
        - name: etc-dir
          mountPath: /etc
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
      # MISCONFIGURATION: HostPath volume for root directory
      - name: host-root
        hostPath:
          path: /
          type: Directory
      # MISCONFIGURATION: HostPath volume for /etc
      - name: etc-dir
        hostPath:
          path: /etc
          type: Directory
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: default
data:
  # MISCONFIGURATION: Hardcoded secret in ConfigMap
  database_url: "mysql://root:hardcoded_password@localhost:3306/mydb"
  api_key: "sk-1234567890abcdef"
---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: default
type: Opaque
stringData:
  mysql-root-password: "rootpassword123"
  mysql-user: "mysqluser"
  mysql-password: "userpassword123"
